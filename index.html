<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FAQ Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="bot-avatar large">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="18" cy="18" r="18" fill="#6366f1"/>
        <rect x="9" y="11" width="18" height="14" rx="4" fill="white" opacity="0.9"/>
        <circle cx="14" cy="18" r="2" fill="#6366f1"/>
        <circle cx="22" cy="18" r="2" fill="#6366f1"/>
        <rect x="14" y="25" width="8" height="2" rx="1" fill="white" opacity="0.7"/>
        <rect x="12" y="7" width="3" height="5" rx="1.5" fill="white" opacity="0.6"/>
        <rect x="21" y="7" width="3" height="5" rx="1.5" fill="white" opacity="0.6"/>
      </svg>
    </div>
    <h2>FAQ Assistant</h2>
    <p class="subtitle">Ask anything about our products &amp; services</p>
  </div>

  <div class="quick-picks">
    <h3>Quick questions</h3>
    <div id="quick-list"></div>
  </div>

  <div class="sidebar-footer">
    <button class="btn-clear" id="clearBtn">Clear chat</button>
  </div>
</aside>

<!-- ── Main chat area ────────────────────────────────────────────────────── -->
<main class="chat-container">

  <header class="chat-header">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>
    <div class="header-title">
      <div class="status-dot"></div>
      <span>Support Chat</span>
    </div>
    <div class="header-badge">Powered by NLP</div>
  </header>

  <div class="messages" id="messages">
    <!-- Welcome bubble added by JS -->
  </div>

  <div class="suggestions" id="suggestions"></div>

  <form class="input-bar" id="chatForm" autocomplete="off">
    <input
      type="text"
      id="userInput"
      placeholder="Type your question…"
      maxlength="300"
      aria-label="Your question"
    />
    <button type="submit" id="sendBtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </form>
</main>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
